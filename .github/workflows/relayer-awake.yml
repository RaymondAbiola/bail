name: Relayer awake

# A free Render service sleeps after 15 idle minutes, and its keeper only settles events while
# it is awake. This asks its health check every 10 minutes. Does nothing until RELAYER_URL is set.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-24.04
    if: vars.RELAYER_URL != ''
    steps:
      - name: Health check
        env:
          RELAYER_URL: ${{ vars.RELAYER_URL }}
        run: curl -sS --retry 3 --retry-delay 20 --max-time 90 "$RELAYER_URL/v1/health"
