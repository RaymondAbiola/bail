name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build the web app
        working-directory: apps/web
        run: npx vite build

      # The site reads results straight from the chain. Actions need a running relayer:
      # set the RELAYER_URL repository variable to point the site at one.
      - name: Add config.json
        working-directory: apps/web
        env:
          RELAYER_URL: ${{ vars.RELAYER_URL }}
        run: jq --arg r "$RELAYER_URL" 'if $r != "" then .relayerUrl = $r else . end' site-config.json > dist/config.json

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
