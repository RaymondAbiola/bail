name: CI

on:
  push:
  pull_request:

jobs:
  contract:
    name: Contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests and 1,000 random event histories
        run: cargo test -p bail --lib
        env:
          PROPTEST_CASES: "1000"

      # Without Ledger support, which would need the libudev system library.
      - name: Install cargo-near
        run: cargo install --locked cargo-near --no-default-features

      - name: Sandbox tests on the compiled contract (cargo-near compiles it)
        run: cargo test -p bail --test sandbox

      - name: Build the contract wasm
        run: cargo near build non-reproducible-wasm --manifest-path contracts/bail/Cargo.toml

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Reuses the near-sandbox binary the sandbox tests downloaded.
      - name: Relayer, keeper, host console and web app run events on a local NEAR node
        run: |
          cargo near build non-reproducible-wasm --manifest-path contracts/test-token/Cargo.toml
          export NEAR_SANDBOX_BIN=$(find "$PWD/target" -type f -name near-sandbox -perm -u+x | head -1)
          test -n "$NEAR_SANDBOX_BIN"
          (cd apps/relayer && node --test test/sandbox.test.ts)
          (cd apps/host && node --test test/sandbox.test.ts)
          (cd apps/web && CHROME_PATH=$(command -v google-chrome) node e2e/run.ts)

  kickback:
    name: Kickback comparison
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Copied files match upstream byte for byte
        working-directory: tests/kickback/src
        run: sha256sum -c ../SHA256SUMS

      - name: The organizer takes every deposit on Kickback
        working-directory: tests/kickback
        run: forge test -vv

  typescript:
    name: SDK, relayer, host console and web app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck --workspaces

      - name: SDK tests, with test vectors built by the contract
        working-directory: packages/sdk
        run: npm test

      - name: Relayer and keeper tests
        working-directory: apps/relayer
        run: node --test test/relayer.test.ts

      - name: Host console tests
        working-directory: apps/host
        run: node --test test/host.test.ts

      - name: Web app tests
        working-directory: apps/web
        run: node --test test/*.test.ts

      - name: Web app builds
        working-directory: apps/web
        run: npx vite build
