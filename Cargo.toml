[workspace]
resolver = "2"
members = ["contracts/bail"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# Tests sign and verify ed25519 thousands of times; optimized dependencies keep
# the property test fast while the contract itself still builds in debug mode.
[profile.dev.package."*"]
opt-level = 3
