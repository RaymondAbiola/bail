<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" width="1120" height="330" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Event lifecycle</title>
  <desc>Main path: Open, Check-in, Reveal, Dispute, Tally, Settled, Closed. Each phase starts at a time fixed when the event is created. Side exits: the organizer can cancel during Open, and the arbiter can void during Dispute; both refund everyone and end in Closed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-refund" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="1120" height="330" fill="#ffffff"/>
  <text x="22" y="34" font-size="13" fill="#475569">Main path. Each phase starts at a time fixed when the event is created, so nobody can move it.</text>

  <!-- Main path -->
  <rect x="22" y="54" width="140" height="84" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="92" y="82" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Open</text>
  <text x="92" y="104" text-anchor="middle" font-size="12" fill="#475569">RSVPs, free cancel</text>
  <text x="92" y="120" text-anchor="middle" font-size="12" fill="#475569">until the cutoff</text>

  <rect x="178" y="54" width="140" height="84" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="248" y="82" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Check-in</text>
  <text x="248" y="104" text-anchor="middle" font-size="12" fill="#475569">codes shown</text>
  <text x="248" y="120" text-anchor="middle" font-size="12" fill="#475569">and caught</text>

  <rect x="334" y="54" width="140" height="84" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="404" y="82" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Reveal</text>
  <text x="404" y="104" text-anchor="middle" font-size="12" fill="#475569">codes revealed</text>
  <text x="404" y="120" text-anchor="middle" font-size="12" fill="#475569">and checked</text>

  <rect x="490" y="54" width="140" height="84" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="560" y="82" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Dispute</text>
  <text x="560" y="104" text-anchor="middle" font-size="12" fill="#475569">vouching for</text>
  <text x="560" y="120" text-anchor="middle" font-size="12" fill="#475569">dead phones</text>

  <rect x="646" y="54" width="140" height="84" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="716" y="82" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Tally</text>
  <text x="716" y="104" text-anchor="middle" font-size="12" fill="#475569">outcomes fixed</text>
  <text x="716" y="120" text-anchor="middle" font-size="12" fill="#475569">before money moves</text>

  <rect x="802" y="54" width="140" height="84" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="872" y="82" text-anchor="middle" font-size="16" font-weight="700" fill="#064e3b">Settled</text>
  <text x="872" y="104" text-anchor="middle" font-size="12" fill="#065f46">attendees paid</text>
  <text x="872" y="120" text-anchor="middle" font-size="12" fill="#065f46">deposit plus share</text>

  <rect x="958" y="54" width="140" height="84" rx="10" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/>
  <text x="1028" y="82" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Closed</text>
  <text x="1028" y="104" text-anchor="middle" font-size="12" fill="#cbd5e1">storage NEAR back</text>
  <text x="1028" y="120" text-anchor="middle" font-size="12" fill="#cbd5e1">to the organizer</text>

  <line x1="162" y1="96" x2="176" y2="96" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="318" y1="96" x2="332" y2="96" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="474" y1="96" x2="488" y2="96" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="96" x2="644" y2="96" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="786" y1="96" x2="800" y2="96" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="942" y1="96" x2="956" y2="96" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Side exits -->
  <line x1="92" y1="138" x2="92" y2="198" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-refund)"/>
  <text x="102" y="164" font-size="12" font-weight="600" fill="#b45309">organizer cancels</text>
  <text x="102" y="180" font-size="12" fill="#b45309">before check-in</text>

  <line x1="560" y1="138" x2="560" y2="198" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-refund)"/>
  <text x="570" y="164" font-size="12" font-weight="600" fill="#b45309">arbiter voids</text>
  <text x="570" y="180" font-size="12" fill="#b45309">before the window ends</text>

  <rect x="22" y="200" width="140" height="50" rx="10" fill="#fffbeb" stroke="#b45309" stroke-dasharray="6 4"/>
  <text x="92" y="231" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">Cancelled</text>

  <rect x="490" y="200" width="140" height="50" rx="10" fill="#fffbeb" stroke="#b45309" stroke-dasharray="6 4"/>
  <text x="560" y="231" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">Voided</text>

  <polyline points="92,250 92,292 1028,292 1028,140" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-refund)"/>
  <line x1="560" y1="250" x2="560" y2="292" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="726" y="280" width="168" height="24" rx="12" fill="#ffffff"/>
  <text x="810" y="297" text-anchor="middle" font-size="13" font-weight="600" fill="#b45309">everyone refunded</text>
</svg>
