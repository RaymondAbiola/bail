<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" width="1200" height="950" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>How Bail works</title>
  <desc>Top: the pieces of Bail in three layers, people, Bail apps and the NEAR contract, with labelled arrows. Bottom: one event in five steps, RSVP, live codes, check in, disputes and settle.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-money" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-refund" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="1200" height="950" fill="#ffffff"/>
  <text x="40" y="42" font-size="24" font-weight="700" fill="#0f172a">How Bail works</text>

  <!-- Layer backgrounds -->
  <rect x="40" y="62" width="1100" height="112" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="84" font-size="12" font-weight="600" letter-spacing="1.5" fill="#64748b">PEOPLE</text>
  <rect x="40" y="212" width="1100" height="132" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="234" font-size="12" font-weight="600" letter-spacing="1.5" fill="#64748b">BAIL APPS</text>
  <text x="1124" y="234" text-anchor="end" font-size="12" font-weight="600" letter-spacing="1.5" fill="#64748b">OFF-CHAIN. ANYONE CAN RUN THEIR OWN</text>
  <rect x="40" y="384" width="1100" height="140" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="406" font-size="12" font-weight="600" letter-spacing="1.5" fill="#64748b">NEAR (ON-CHAIN)</text>

  <!-- People -->
  <rect x="80" y="94" width="280" height="64" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="220" y="120" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Organizer</text>
  <text x="220" y="142" text-anchor="middle" font-size="13" fill="#475569">Hosts the event</text>

  <rect x="460" y="94" width="280" height="64" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="600" y="120" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Attendee</text>
  <text x="600" y="142" text-anchor="middle" font-size="13" fill="#475569">RSVPs, shows up, gets paid</text>

  <rect x="840" y="94" width="280" height="64" rx="10" fill="#ffffff" stroke="#b45309"/>
  <text x="980" y="120" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Arbiter</text>
  <text x="980" y="142" text-anchor="middle" font-size="13" fill="#475569">Never the organizer. Can only refund</text>

  <!-- Apps -->
  <rect x="80" y="246" width="280" height="84" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="220" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Host console</text>
  <text x="220" y="294" text-anchor="middle" font-size="13" fill="#475569">Its key can only open code slots</text>
  <text x="220" y="314" text-anchor="middle" font-size="13" fill="#475569">It can't move any money</text>

  <rect x="460" y="246" width="280" height="84" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="600" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Web app</text>
  <text x="600" y="294" text-anchor="middle" font-size="13" fill="#475569">Keeps your ticket key in the browser</text>
  <text x="600" y="314" text-anchor="middle" font-size="13" fill="#475569">Signs your RSVP and check-ins</text>

  <rect x="840" y="246" width="280" height="84" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="980" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Relayer and keeper</text>
  <text x="980" y="294" text-anchor="middle" font-size="13" fill="#475569">Pays the gas, settles events</text>
  <text x="980" y="314" text-anchor="middle" font-size="13" fill="#475569">It can't move any money</text>

  <!-- Contract -->
  <rect x="80" y="416" width="1040" height="94" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="600" y="448" text-anchor="middle" font-size="20" font-weight="700" fill="#064e3b">Bail contract</text>
  <text x="600" y="474" text-anchor="middle" font-size="14" fill="#065f46">Holds every deposit and every rule. Locked: no admin, no upgrades.</text>
  <text x="600" y="496" text-anchor="middle" font-size="14" fill="#065f46">Nobody can mark you absent. Anyone can settle once the deadlines pass.</text>

  <!-- Mainnet rails -->
  <rect x="460" y="572" width="660" height="70" rx="10" fill="#ffffff" stroke="#0f766e" stroke-dasharray="6 4"/>
  <text x="790" y="601" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">NEAR Intents and 1Click (mainnet only)</text>
  <text x="790" y="623" text-anchor="middle" font-size="13" fill="#475569">Pay the deposit from any chain. Get paid out on any chain.</text>

  <!-- Arrows: people to apps -->
  <line x1="220" y1="158" x2="220" y2="244" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="208" y="205" text-anchor="end" font-size="12" fill="#475569">runs the codes</text>

  <line x1="600" y1="158" x2="600" y2="244" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="612" y="205" font-size="12" fill="#475569">RSVPs and types codes</text>

  <line x1="352" y1="246" x2="466" y2="160" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="400" y="186" text-anchor="end" font-size="12" fill="#475569">code shown in the call</text>

  <!-- Arrows: apps to each other and to the contract -->
  <line x1="740" y1="288" x2="838" y2="288" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="789" y="279" text-anchor="middle" font-size="12" fill="#475569">signed</text>
  <text x="789" y="306" text-anchor="middle" font-size="12" fill="#475569">check-ins</text>

  <line x1="220" y1="330" x2="220" y2="414" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="232" y="377" font-size="12" fill="#475569">opens code slots</text>

  <line x1="600" y1="332" x2="600" y2="414" stroke="#0f766e" stroke-width="2.5" marker-start="url(#arrow-money)" marker-end="url(#arrow-money)"/>
  <text x="612" y="377" font-size="12" font-weight="600" fill="#0f766e">USDC: deposit in, payout out</text>

  <line x1="980" y1="330" x2="980" y2="414" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="992" y="377" font-size="12" fill="#475569">submits, then settles</text>

  <!-- Arbiter: refund only -->
  <polyline points="1120,126 1162,126 1162,463 1122,463" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-refund)"/>
  <text x="1178" y="295" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309" transform="rotate(90 1178 295)">void: everyone refunded</text>

  <!-- Mainnet rails into the contract -->
  <line x1="790" y1="570" x2="790" y2="512" stroke="#0f766e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-money)"/>
  <text x="802" y="546" font-size="12" font-weight="600" fill="#0f766e">any chain</text>

  <!-- Five steps -->
  <text x="40" y="704" font-size="20" font-weight="700" fill="#0f172a">One event, five steps</text>

  <g>
    <rect x="40" y="722" width="200" height="200" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="68" cy="754" r="16" fill="#0f172a"/>
    <text x="68" y="759" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
    <text x="94" y="760" font-size="16" font-weight="700" fill="#0f172a">RSVP</text>
    <text x="56" y="796" font-size="13" fill="#334155">Pay a small deposit,</text>
    <text x="56" y="816" font-size="13" fill="#334155">for example $1. Your</text>
    <text x="56" y="836" font-size="13" fill="#334155">browser keeps a</text>
    <text x="56" y="856" font-size="13" fill="#334155">ticket key.</text>
    <text x="56" y="902" font-size="12" font-weight="600" fill="#0f766e">Deposit held by Bail</text>
  </g>
  <path d="M244,822 L261,822" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="265" y="722" width="200" height="200" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="293" cy="754" r="16" fill="#0f172a"/>
    <text x="293" y="759" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
    <text x="319" y="760" font-size="16" font-weight="700" fill="#0f172a">Live codes</text>
    <text x="281" y="796" font-size="13" fill="#334155">During the call the</text>
    <text x="281" y="816" font-size="13" fill="#334155">host shows 3 codes</text>
    <text x="281" y="836" font-size="13" fill="#334155">at random moments.</text>
    <text x="281" y="902" font-size="12" font-weight="600" fill="#0f766e">Code fixed onchain</text>
  </g>
  <path d="M469,822 L486,822" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="490" y="722" width="200" height="200" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="518" cy="754" r="16" fill="#0f172a"/>
    <text x="518" y="759" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
    <text x="544" y="760" font-size="16" font-weight="700" fill="#0f172a">Check in</text>
    <text x="506" y="796" font-size="13" fill="#334155">Type each code within</text>
    <text x="506" y="816" font-size="13" fill="#334155">2 minutes (typos fixable).</text>
    <text x="506" y="836" font-size="13" fill="#334155">Catching 2 of the 3</text>
    <text x="506" y="856" font-size="13" fill="#334155">means you attended.</text>
    <text x="506" y="902" font-size="12" font-weight="600" fill="#0f766e">Nobody can erase it</text>
  </g>
  <path d="M694,822 L711,822" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="715" y="722" width="200" height="200" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="743" cy="754" r="16" fill="#0f172a"/>
    <text x="743" y="759" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
    <text x="769" y="760" font-size="16" font-weight="700" fill="#0f172a">Disputes</text>
    <text x="731" y="796" font-size="13" fill="#334155">Phone died? Two</text>
    <text x="731" y="816" font-size="13" fill="#334155">attendees vouch for</text>
    <text x="731" y="836" font-size="13" fill="#334155">you. The arbiter can</text>
    <text x="731" y="856" font-size="13" fill="#334155">only refund everyone.</text>
    <text x="731" y="902" font-size="12" font-weight="600" fill="#0f766e">Every lever refunds</text>
  </g>
  <path d="M919,822 L936,822" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="940" y="722" width="200" height="200" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="968" cy="754" r="16" fill="#0f172a"/>
    <text x="968" y="759" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">5</text>
    <text x="994" y="760" font-size="16" font-weight="700" fill="#0f172a">Settle</text>
    <text x="956" y="796" font-size="13" fill="#334155">Anyone can settle.</text>
    <text x="956" y="816" font-size="13" fill="#334155">Attendees get their</text>
    <text x="956" y="836" font-size="13" fill="#334155">deposit back plus a</text>
    <text x="956" y="856" font-size="13" fill="#334155">share. No-shows get</text>
    <text x="956" y="876" font-size="13" fill="#334155">nothing.</text>
    <text x="956" y="902" font-size="12" font-weight="600" fill="#0f766e">Paid automatically</text>
  </g>
</svg>
