[package]
name = "bail"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
repository = "https://github.com/RaymondAbiola/bail"

[package.metadata.near.reproducible_build]
# Image recommended by cargo-near 0.22; the digest, not the tag, identifies it.
image = "sourcescan/cargo-near:0.21.1-rust-1.96.0"
image_digest = "sha256:ccb22bb4e677ed022d8b9d1aa1b32f0af52dd0471ef1c32e48dedbf68ee6ee17"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"
near-contract-standards = "5.30.0"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
ed25519-dalek = "2.1"
proptest = "1.12"
near-workspaces = { version = "0.24.0", features = ["unstable"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
sha2 = "0.10"
serde_json = "1"
